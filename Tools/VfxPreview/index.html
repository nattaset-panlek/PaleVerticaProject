<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>VFX Style Gallery</title>
<style>
:root{--bg:#0d0f13;--panel:#161a21;--line:#262c36;--text:#e6e9ef;--muted:#8a93a3;--accent:#7cc4ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,"Noto Sans Thai",sans-serif}
header{position:sticky;top:0;z-index:2;background:rgba(13,15,19,.95);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
h1{font-size:16px;margin:0 8px 0 0}.group{display:flex;gap:6px;align-items:center;color:var(--muted)}
.ramp{width:46px;height:18px;border-radius:4px;border:2px solid transparent;cursor:pointer}.ramp.on{border-color:#fff}
select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
main{padding:16px}section h2{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:18px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}.card.picked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
canvas{display:block;width:100%;aspect-ratio:1}.info{padding:10px 12px}.name{font-weight:600}.desc{color:var(--muted);font-size:13px;margin:4px 0 8px}
label.pick{display:flex;gap:6px;align-items:center;cursor:pointer}footer{padding:16px;border-top:1px solid var(--line)}
.desc code{word-break:break-all;font-size:12px}textarea{width:100%;height:60px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px;font:13px monospace}
</style></head><body>
<header><h1>VFX Style Gallery</h1>
<div class="group">Gradient map <span id="ramps" style="display:flex;gap:6px"></span></div>
<div class="group">Speed <select id="speed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select></div>
<div class="group">BG <select id="bg"><option value="#343844">Slate</option><option value="#0d0f13">Dark</option><option value="#3b5a3a">Grass</option><option value="#7a705f">Stone</option></select></div>
<div class="group"><label class="pick"><input type="checkbox" id="frames"> Frame strip</label></div>
</header>
<main id="main"></main>
<footer><div class="desc">Sheet เป็นขาวดำเท่านั้น สีมาจาก gradient map (ใน Unity ใช้ shader ตัวเดียวกัน) ติ๊ก "เลือก" แล้ว copy ข้อความนี้ส่งกลับมา</div><textarea id="out" readonly></textarea></footer>
<script>
const DATA=__DATA__;const FPS=__FPS__,SIZE=256;
const RAMPS={
 Fire:[[0,"#1a0607"],[.25,"#6e1412"],[.5,"#dc4620"],[.75,"#ffaa32"],[1,"#fff8d2"]],
 Arcane:[[0,"#070a24"],[.25,"#1d2c8c"],[.5,"#3f6dff"],[.75,"#8fd4ff"],[1,"#f2fcff"]],
 Void:[[0,"#12041e"],[.25,"#40106a"],[.5,"#9a2ee0"],[.75,"#e48aff"],[1,"#fff2ff"]],
 Poison:[[0,"#08140a"],[.25,"#1f4f16"],[.5,"#62c21e"],[.75,"#d0ff52"],[1,"#fbffe2"]],
 Holy:[[0,"#1c1406"],[.25,"#704c10"],[.5,"#e3a92c"],[.75,"#ffe47c"],[1,"#fffcea"]],
 Ice:[[0,"#04121c"],[.25,"#0f4a6a"],[.5,"#36a6d6"],[.75,"#a6ecff"],[1,"#ffffff"]],
 Raw:[[0,"#000000"],[1,"#ffffff"]]};
function hex(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function lut(name){const st=RAMPS[name].map(([p,c])=>[p,hex(c)]);const t=new Uint8ClampedArray(256*3);for(let i=0;i<256;i++){const v=i/255;let k=0;while(k<st.length-2&&v>st[k+1][0])k++;const[a,ca]=st[k],[b,cb]=st[k+1];const u=Math.min(1,Math.max(0,(v-a)/(b-a||1)));for(let c=0;c<3;c++)t[i*3+c]=ca[c]+(cb[c]-ca[c])*u}return t}
let ramp="Fire",speed=1,bg="#343844",strip=false;const picked=new Set();const cards=[];
const rampsEl=document.getElementById("ramps");
for(const k of Object.keys(RAMPS)){const s=document.createElement("span");s.className="ramp"+(k===ramp?" on":"");s.title=k;s.style.background="linear-gradient(90deg,"+RAMPS[k].map(([p,c])=>c+" "+p*100+"%").join(",")+")";s.onclick=()=>{ramp=k;document.querySelectorAll(".ramp").forEach(e=>e.classList.remove("on"));s.classList.add("on");recolorAll()};rampsEl.appendChild(s)}
document.getElementById("speed").onchange=e=>speed=+e.target.value;document.getElementById("bg").onchange=e=>bg=e.target.value;document.getElementById("frames").onchange=e=>strip=e.target.checked;
const main=document.getElementById("main");const groups={};
for(const d of DATA){if(!groups[d.cat]){const sec=document.createElement("section");sec.innerHTML="<h2>"+d.cat+"</h2>";const g=document.createElement("div");g.className="grid";sec.appendChild(g);main.appendChild(sec);groups[d.cat]=g}
const card=document.createElement("div");card.className="card";const cv=document.createElement("canvas");cv.width=SIZE;cv.height=SIZE;
const info=document.createElement("div");info.className="info";info.innerHTML='<div class="name">'+d.name+'</div><div class="desc">'+d.desc+'</div>';
const lab=document.createElement("label");lab.className="pick";const cb=document.createElement("input");cb.type="checkbox";cb.onchange=()=>{cb.checked?picked.add(d.name):picked.delete(d.name);card.classList.toggle("picked",cb.checked);document.getElementById("out").value="เลือก: "+[...picked].join(", ")};lab.append(cb," เลือก");info.appendChild(lab);
card.append(cv,info);groups[d.cat].appendChild(card);
const img=new Image();const k={ctx:cv.getContext("2d"),src:null,mapped:document.createElement("canvas"),frames:d.frames,grid:Math.ceil(Math.sqrt(d.frames)),cell:SIZE};
img.onload=()=>{const c=document.createElement("canvas");c.width=img.width;c.height=img.height;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(img,0,0);k.src=x.getImageData(0,0,c.width,c.height);k.cell=img.width/k.grid;k.mapped.width=c.width;k.mapped.height=c.height;recolor(k,lut(ramp))};
img.src=d.src;cards.push(k)}
function recolor(k,t){if(!k.src)return;const s=k.src.data;const out=new ImageData(k.src.width,k.src.height);const o=out.data;for(let i=0;i<s.length;i+=4){const v=s[i]*3;o[i]=t[v];o[i+1]=t[v+1];o[i+2]=t[v+2];o[i+3]=s[i+3]}k.mapped.getContext("2d").putImageData(out,0,0)}
function recolorAll(){const t=lut(ramp);for(const k of cards)recolor(k,t)}
let t0=performance.now();
function loop(now){const tick=Math.floor((now-t0)/1000*FPS*speed);
for(const k of cards){if(!k.src)continue;const c=k.ctx;c.fillStyle=bg;c.fillRect(0,0,SIZE,SIZE);
const g=k.grid,e=k.cell,f=tick%(k.frames+8);if(strip){const s=SIZE/g;for(let i=0;i<k.frames;i++)c.drawImage(k.mapped,(i%g)*e,Math.floor(i/g)*e,e,e,(i%g)*s,Math.floor(i/g)*s,s,s)}else if(f<k.frames)c.drawImage(k.mapped,(f%g)*e,Math.floor(f/g)*e,e,e,0,0,SIZE,SIZE)}
requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
